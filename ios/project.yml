# Xcode project spec. Generate NunKil.xcodeproj with: cd ios && xcodegen
name: NunKil
options:
  deploymentTarget:
    iOS: "17.2"
  createIntermediateGroups: true

packages:
  MWDAT:
    url: https://github.com/facebook/meta-wearables-dat-ios
    exactVersion: 0.9.0
  # Shared with eyeassist. Local path during development, git tag once stable.
  GlassesKit:
    path: ../../glasseskit

configFiles:
  Debug: NunKil/Secrets.xcconfig
  Release: NunKil/Secrets.xcconfig

targets:
  NunKil:
    type: application
    platform: iOS
    sources:
      - path: NunKil
        excludes:
          - "*.xcconfig"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yangjongwon.nunkil
        INFOPLIST_FILE: NunKil/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
    dependencies:
      - package: GlassesKit
        product: GlassesKit
      - package: MWDAT
        product: MWDATCore
      - package: MWDAT
        product: MWDATCamera
      # Only imported under #if DEBUG.
      - package: MWDAT
        product: MWDATMockDevice

  NunKilTests:
    type: bundle.unit-test
    platform: iOS
    sources: [NunKilTests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
    dependencies:
      - target: NunKil

schemes:
  NunKil:
    build:
      targets:
        NunKil: all
        NunKilTests: [test]
    test:
      targets: [NunKilTests]
